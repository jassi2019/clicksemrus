name: Trending content
on:
  schedule:
    - cron: "10 3 * * *"   # daily 08:40 IST: 3 keyword articles + 1 top trend every other day (gap enforced in the route)
  workflow_dispatch:
    inputs:
      topic:
        description: "Publish one trend post about this topic right now (optional, e.g. GTA 6)"
        required: false
        default: ""
      pages:
        description: "Set to 1 to re-index the core pages (home, services, pricing...) instead of publishing"
        required: false
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keyword + trend articles, covers, index pings
        run: |
          curl -sS -G --max-time 295 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://clicksemrus.vercel.app/api/cron/trending" \
            --data-urlencode "limit=1" --data-urlencode "keywords=3" \
            --data-urlencode "topic=${{ github.event.inputs.topic || '' }}"             --data-urlencode "pages=${{ github.event.inputs.pages || '' }}" | head -c 2000
